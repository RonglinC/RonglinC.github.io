<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd9c2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Qingqing" />
    <meta
      name="description"
      content="Qingqing maps security, cloud, Azure, endpoint, vulnerability, finance, and AI news for detection engineers."
    />
    <title>Qingqing — Security news map</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#search">Skip to search</a>

    <header class="chrome">
      <a class="brand" href="./" aria-label="Qingqing home">
        <img src="./character.svg" width="44" height="48" alt="" />
        <span>
          <strong>Qingqing</strong>
          <em>for detection engineers</em>
        </span>
      </a>
      <form class="search-box" id="search-form" role="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <label class="sr-only" for="search">Search by CVE, vendor, product, or topic</label>
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Search CVE, vendor, Azure, EDR, ransomware…"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="search-clear" class="search-clear" type="button" hidden>Clear</button>
      </form>
      <div class="header-actions">
        <button id="install" class="ghost" type="button" hidden>Install app</button>
        <button id="refresh" class="refresh" type="button">Refresh</button>
      </div>
    </header>

    <div class="search-hints" id="search-hints">
      <span>Try:</span>
      <button type="button" data-q="CVE-">CVE</button>
      <button type="button" data-q="Microsoft">Microsoft</button>
      <button type="button" data-q="Azure">Azure</button>
      <button type="button" data-q="ransomware">ransomware</button>
      <button type="button" data-q="EDR">EDR</button>
      <button type="button" data-q="Okta">Okta</button>
    </div>

    <nav class="topics" id="topics" aria-label="Topic">
      <button type="button" data-topic="all" aria-pressed="true">All</button>
      <button type="button" data-topic="security" aria-pressed="false">Security</button>
      <button type="button" data-topic="vuln" aria-pressed="false">Vulnerabilities</button>
      <button type="button" data-topic="cloud" aria-pressed="false">Cloud</button>
      <button type="button" data-topic="azure" aria-pressed="false">Azure</button>
      <button type="button" data-topic="endpoint" aria-pressed="false">Endpoint</button>
      <button type="button" data-topic="finance" aria-pressed="false">Finance</button>
      <button type="button" data-topic="ai" aria-pressed="false">AI</button>
      <label class="source-pick">
        <span class="sr-only">Filter by source</span>
        <select id="source-filter">
          <option value="all">All sources</option>
        </select>
      </label>
    </nav>

    <p class="status" id="status">Loading stories…</p>

    <div class="sky-wrap" id="sky-wrap">
      <div class="sky" id="sky" aria-label="Related-story map">
        <svg class="links" id="links" aria-hidden="true"></svg>
        <button class="hub" id="hub" type="button" title="Clear filters and show recent stories">
          <img src="./character.svg" width="120" height="132" alt="" />
          <span>Qingqing</span>
          <small id="hub-caption">recent stories</small>
        </button>
      </div>
    </div>

    <section id="sheet" class="sheet" hidden>
      <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">×</button>
      <div id="sheet-body"></div>
    </section>

    <script src="./app.js" defer></script>
  </body>
</html>
