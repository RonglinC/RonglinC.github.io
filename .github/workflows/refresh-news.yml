name: Refresh news feeds

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-news.py"
      - ".github/workflows/refresh-news.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public RSS snapshots
        run: python3 scripts/fetch-news.py
      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data/feed.json
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore: refresh security and AI news snapshot"
            git push
          fi
